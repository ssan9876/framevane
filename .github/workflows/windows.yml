# Windows (x64), in parallel jobs:
#   models   the local AI models, downloaded once into a cache shared with every shard (and the macOS workflow)
#   e2e      the Electron e2e suite in 3 shards
#   package  the portable .zip release and its smoke test
# Unit tests and typecheck run once for every platform in checks.yml. Artifacts: the release, and the Playwright
# results of any shard that fails.
name: Windows

on:
  # pushes to a branch with an open PR are tested by the pull_request run; pushing to feat/** too ran everything twice
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  models:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # one cache for both platforms (enableCrossOsArchive: Windows runners read and write it too)
      - name: Restore AI models
        id: models
        uses: actions/cache/restore@v4
        with:
          path: .models
          key: models-v2-${{ hashFiles('sidecar/framevane_sidecar/models.py') }}
          enableCrossOsArchive: true
      - uses: astral-sh/setup-uv@v6
        if: steps.models.outputs.cache-hit != 'true'
        with:
          version: 0.11.28
      - name: Download the models
        if: steps.models.outputs.cache-hit != 'true'
        run: uv run --no-project --with faster-whisper==1.2.1 python .github/scripts/fetch-models.py .models
      - name: Save AI models
        if: steps.models.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .models
          key: ${{ steps.models.outputs.cache-primary-key }}
          enableCrossOsArchive: true

  e2e:
    needs: models
    runs-on: windows-2025
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      FRAMEVANE_MODELS_DIR: ${{ github.workspace }}\.models
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.11.28
      # a release build from Gyan (kept, unlike BtbN's autobuilds), checksum-pinned; it has drawtext for the test media
      # and h264_nvenc built in, which this GPU-less runner can't run (the BUG-016 fallback to libx264 gets exercised)
      - name: FFmpeg for the tests
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $env:RUNNER_TEMP 'ffmpeg.zip'
          Invoke-WebRequest -Uri 'https://github.com/GyanD/codexffmpeg/releases/download/9.1/ffmpeg-9.1-essentials_build.zip' -OutFile $zip
          $sum = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          if ($sum -ne 'b9bbbb3acece000cbeec994f856649354e52c773807841e78908374b24d658fd') { throw "ffmpeg.zip checksum $sum doesn't match" }
          Expand-Archive $zip -DestinationPath (Join-Path $env:RUNNER_TEMP 'ffmpeg')
          $bin = (Get-ChildItem (Join-Path $env:RUNNER_TEMP 'ffmpeg') -Recurse -Filter ffmpeg.exe | Select-Object -First 1).DirectoryName
          Add-Content $env:GITHUB_PATH $bin
          & "$bin\ffmpeg.exe" -hide_banner -version | Select-Object -First 1
          if (-not (& "$bin\ffmpeg.exe" -hide_banner -filters | Select-String -SimpleMatch ' drawtext ')) { throw 'this FFmpeg has no drawtext' }
      - run: pnpm install --frozen-lockfile
      - name: Build
        working-directory: apps/desktop
        run: node scripts/build.mjs
      - name: Restore AI models
        uses: actions/cache/restore@v4
        with:
          path: .models
          key: models-v2-${{ hashFiles('sidecar/framevane_sidecar/models.py') }}
          enableCrossOsArchive: true
      - name: Restore seed media
        id: seed
        uses: actions/cache/restore@v4
        with:
          path: replica/seed-media
          key: seed-media-win-${{ hashFiles('apps/desktop/scripts/make-seed-media.ps1', 'apps/desktop/e2e/global-setup.ts') }}
      - name: E2E (Playwright + Electron), shard ${{ matrix.shard }} of 3
        working-directory: apps/desktop
        run: npx playwright test --shard=${{ matrix.shard }}/3 --reporter=list,github
      # every shard makes the same seed media; one saves it (a cache can't be saved twice under one key)
      - name: Save seed media
        if: ${{ !cancelled() && matrix.shard == 1 && steps.seed.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: replica/seed-media
          key: ${{ steps.seed.outputs.cache-primary-key }}
      - name: Upload e2e results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-windows-${{ matrix.shard }}
          path: apps/desktop/test-results
          retention-days: 7

  package:
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build
        working-directory: apps/desktop
        run: node scripts/build.mjs
      - name: Package (.zip)
        working-directory: apps/desktop
        run: node scripts/package.mjs
      - name: Smoke-test the release
        working-directory: apps/desktop
        run: node scripts/smoke-release.mjs (Get-ChildItem release/Framevane-*-win-x64.zip).FullName
      - name: Upload the release
        uses: actions/upload-artifact@v4
        with:
          name: Framevane-win-x64
          path: |
            apps/desktop/release/*.zip
            apps/desktop/release/*.sha256
          retention-days: 14
