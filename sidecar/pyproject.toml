[project]
name = "reel-sidecar"
version = "0.1.0"
description = "Local AI tools for reel, served as an MCP server over stdio"
requires-python = ">=3.12,<3.13"
dependencies = [
  "mcp==2.3.0",
  "faster-whisper==1.2.1",
  "ctranslate2==4.8.2",
  "av==14.2.0",
  "nvidia-cublas-cu12==12.9.2.10; sys_platform == 'win32' or sys_platform == 'linux'",
  "nvidia-cudnn-cu12==9.27.0.42; sys_platform == 'win32' or sys_platform == 'linux'",
]

[tool.uv]
package = false
